name: CI Linting

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install linters
        run: |
          npm install --save-dev \
            eslint@9 \
            html-validate \
            stylelint \
            stylelint-config-standard

      - name: Run ESLint
        run: npx eslint --config .ci/eslint.config.js app.js

      - name: Run html-validate
        run: npx html-validate --config .ci/.htmlvalidate.json lookUP.html

      - name: Run Stylelint
        run: npx stylelint --config .ci/.stylelintrc.json style.css
